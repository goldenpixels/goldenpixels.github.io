<!doctype html><meta charset="utf-8"><title>paste</title><button id="b" style="font-size:32px;padding:20px">TEMPEL DI SINI</button><pre id="o" style="font-size:24px;white-space:pre-wrap"></pre><script>document.getElementById('b').onclick=async()=>{try{document.getElementById('o').textContent=await navigator.clipboard.readText()}catch(e){document.getElementById('o').textContent='ERR '+e.message}}</script>
